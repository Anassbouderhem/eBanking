<div class="container mt-2">
  <div class="card">
    <div class="card-header">
      Customer Accounts : {{ customer.name }}
    </div>
    <div class="card-body">
      <p><strong>ID :</strong> {{ customerId }}</p>
      <p><strong>Email :</strong> {{ customer.email }}</p>

      <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
          <th>Account ID</th>
          <th>Type</th>
          <th>Balance</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let acc of accounts$ | async">
          <td>{{ acc.id }}</td>
          <td>{{ acc.type }}</td>
          <td>{{ acc.balance | number:'1.2-2' }}</td>
          <td>{{ acc.status }}</td>
          <td>
            <button (click)="handleAccountDetails(acc.id)" class="btn btn-info btn-sm">
              <i class="bi bi-eye"></i>
            </button>
          </td>
        </tr>
        </tbody>
      </table>

    </div>
  </div>
</div>
